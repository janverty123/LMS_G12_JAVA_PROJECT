spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.apptitle: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}

minio:
  endpoint: ${MINIO_ENDPOINT}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  initialize-bucket: ${MINIO_INITIALIZE_BUCKET:false}
  presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:900}
  max-file-size-bytes: ${MINIO_MAX_FILE_SIZE_BYTES:524288000}
