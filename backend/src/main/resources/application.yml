spring:
  application:
    name: apptitle-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apptitle}
    username: ${DB_USERNAME:apptitle}
    password: ${DB_PASSWORD:apptitle_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Local development uses update. Production overrides this with validate;
      # apply the ordered SQL scripts in migration_scripts/ before startup.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:apptitle_admin}
  secret-key: ${MINIO_SECRET_KEY:apptitle_dev_password}
  bucket: ${MINIO_BUCKET:apptitle-files}
  initialize-bucket: ${MINIO_INITIALIZE_BUCKET:true}
  presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:900}
  max-file-size-bytes: ${MINIO_MAX_FILE_SIZE_BYTES:524288000}

logging:
  level:
    com.apptitle: INFO
    org.springframework.security: INFO
